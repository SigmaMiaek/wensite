<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0xRules — Pierwszy Serwer Anarchii Hytale w Polsce</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Oswald:wght@700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #C800FF;
    --blue: #8B00E8;
    --yellow: #FFE500;
    --black: #0A0808;
    --white: #FFF8DC;
    --orange: #FFB800;
    --purple: #6200CC;
    --green: #FFE500;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0D0010;
    color: var(--white);
    font-family: 'Bangers', cursive;
    overflow-x: hidden;
    cursor: default;
  }

  /* HALFTONE DOT OVERLAY */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 12px 12px;
    pointer-events: none;
    z-index: 1;
  }

  /* NOISE TEXTURE */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 2;
    opacity: 0.4;
  }

  /* LANGUAGE SWITCHER */
  .lang-switch {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
    display: flex;
    gap: 4px;
    background: var(--black);
    border: 3px solid var(--yellow);
    padding: 4px;
    box-shadow: 4px 4px 0 var(--purple);
    transform: rotate(1deg);
  }

  .lang-btn {
    font-family: 'Bangers', cursive;
    font-size: 18px;
    letter-spacing: 2px;
    padding: 6px 14px;
    border: none;
    cursor: pointer;
    background: transparent;
    color: var(--white);
    transition: all 0.15s;
    position: relative;
  }

  .lang-btn.active {
    background: var(--yellow);
    color: var(--black);
    text-shadow: none;
  }

  .lang-btn:hover:not(.active) {
    background: rgba(255,229,0,0.2);
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 16px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
  }

  .nav-logo {
    font-family: 'Bangers', cursive;
    font-size: 32px;
    letter-spacing: 4px;
    color: var(--yellow);
    text-shadow: 3px 3px 0 var(--black), -1px -1px 0 var(--purple);
    transform: skewX(-5deg);
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow: hidden;
    padding-top: 100px;
  }

  /* COMIC PANEL BORDERS */
  .comic-border {
    position: absolute;
    inset: 0;
    border: 8px solid var(--black);
    z-index: 10;
    pointer-events: none;
  }

  /* BIG BG TEXT GRAFFITI */
  .bg-graffiti {
    position: absolute;
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(80px, 18vw, 240px);
    color: transparent;
    -webkit-text-stroke: 3px rgba(232,0,45,0.15);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-8deg);
    white-space: nowrap;
    pointer-events: none;
    z-index: 3;
    letter-spacing: -10px;
  }

  /* ANGLED BG STRIPES */
  .stripes {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -55deg,
      transparent,
      transparent 40px,
      rgba(232,0,45,0.04) 40px,
      rgba(232,0,45,0.04) 80px
    );
    z-index: 3;
  }

  /* SPEED LINES */
  .speedlines {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 200%;
    height: 200%;
    transform: translate(-50%, -50%);
    z-index: 4;
    pointer-events: none;
  }

  .speedlines::before {
    content: '';
    position: absolute;
    inset: 0;
    background: conic-gradient(
      from 180deg at 50% 50%,
      transparent 0deg,
      rgba(232,0,45,0.03) 2deg,
      transparent 4deg,
      transparent 10deg,
      rgba(0,51,204,0.03) 12deg,
      transparent 14deg,
      transparent 20deg,
      rgba(232,0,45,0.03) 22deg,
      transparent 24deg,
      transparent 30deg,
      rgba(255,215,0,0.02) 32deg,
      transparent 34deg
    );
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }

  .hero-content {
    position: relative;
    z-index: 20;
    text-align: center;
    padding: 40px 20px 60px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* STICKER LABELS */
  .sticker {
    display: inline-block;
    background: var(--yellow);
    color: var(--black);
    font-family: 'Permanent Marker', cursive;
    font-size: 14px;
    padding: 4px 12px;
    transform: rotate(-1deg);
    border: 3px solid var(--black);
    box-shadow: 3px 3px 0 var(--black);
    margin-bottom: 20px;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .hero-title {
    font-family: 'Bangers', cursive;
    font-size: clamp(60px, 15vw, 180px);
    line-height: 0.9;
    letter-spacing: 6px;
    position: relative;
    display: inline-block;
  }

  .hero-title .line1 {
    display: block;
    color: var(--white);
    text-shadow:
      4px 4px 0 var(--purple),
      8px 8px 0 rgba(98,0,204,0.4);
  }

  .hero-title .line2 {
    display: block;
    color: var(--yellow);
    text-shadow:
      4px 4px 0 var(--purple),
      8px 8px 0 rgba(194,0,255,0.4);
    transform: skewX(-8deg);
    display: inline-block;
  }

  .hero-title .line3 {
    display: block;
    color: var(--red);
    text-shadow:
      4px 4px 0 var(--purple),
      8px 8px 0 var(--yellow);
  }

  /* HALFTONE DOTS decoration */
  .dots-deco {
    position: absolute;
    pointer-events: none;
    z-index: 15;
  }

  .dots-deco svg circle {
    fill: var(--red);
  }

  /* WEB LINES decoration */
  .web-corner {
    position: absolute;
    opacity: 0.3;
    z-index: 12;
  }

  .hero-sub {
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(16px, 3vw, 28px);
    color: var(--yellow);
    text-shadow: 2px 2px 0 var(--black);
    margin-top: 16px;
    transform: rotate(-1deg);
    display: inline-block;
  }

  /* IP BOX */
  .ip-box {
    margin-top: 40px;
    display: inline-block;
    position: relative;
  }

  .ip-box-inner {
    background: var(--black);
    border: 5px solid var(--yellow);
    box-shadow: 8px 8px 0 var(--purple), 12px 12px 0 var(--yellow);
    padding: 16px 40px;
    font-size: clamp(22px, 5vw, 42px);
    letter-spacing: 4px;
    color: var(--yellow);
    text-shadow: 2px 2px 0 var(--black);
    font-family: 'Oswald', sans-serif;
    position: relative;
    transform: skewX(-3deg);
    cursor: pointer;
    transition: all 0.15s;
  }

  .ip-box-inner:hover {
    transform: skewX(-3deg) translate(-2px, -2px);
    box-shadow: 10px 10px 0 var(--purple), 14px 14px 0 var(--yellow);
    color: var(--white);
  }

  .ip-label {
    position: absolute;
    top: -18px;
    left: 10px;
    background: var(--purple);
    color: var(--white);
    font-size: 12px;
    letter-spacing: 3px;
    padding: 2px 10px;
    border: 2px solid var(--black);
    font-family: 'Oswald', sans-serif;
  }

  .ip-copied {
    display: none;
    position: absolute;
    bottom: -30px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Permanent Marker', cursive;
    font-size: 14px;
    color: var(--green);
    text-shadow: 1px 1px 0 var(--black);
    white-space: nowrap;
  }

  .ip-copied.show { display: block; }

  /* BUTTONS */
  .btn-group {
    margin-top: 40px;
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Bangers', cursive;
    font-size: 22px;
    letter-spacing: 3px;
    padding: 14px 36px;
    border: 4px solid var(--black);
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: all 0.15s;
    position: relative;
    text-shadow: 2px 2px 0 var(--black);
  }

  .btn-discord {
    background: #5865F2;
    color: var(--white);
    box-shadow: 6px 6px 0 var(--black);
    transform: rotate(-1deg);
  }

  .btn-discord:hover {
    transform: rotate(-1deg) translate(-3px, -3px);
    box-shadow: 9px 9px 0 var(--black);
  }

  .btn-primary {
    background: var(--purple);
    color: var(--white);
    box-shadow: 6px 6px 0 var(--black);
    transform: rotate(1deg);
  }

  .btn-primary:hover {
    transform: rotate(1deg) translate(-3px, -3px);
    box-shadow: 9px 9px 0 var(--black);
  }

  /* SECTION DIVIDER - comic panel line */
  .panel-divider {
    height: 12px;
    background: var(--black);
    border-top: 4px solid var(--white);
    border-bottom: 4px solid var(--white);
    position: relative;
    overflow: hidden;
  }

  .panel-divider::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      var(--red) 0px,
      var(--red) 40px,
      var(--purple) 40px,
      var(--purple) 80px,
      var(--yellow) 80px,
      var(--yellow) 120px,
      var(--black) 120px,
      var(--black) 160px
    );
    opacity: 0.8;
  }

  /* ANARCHY SECTION */
  .anarchy-section {
    position: relative;
    padding: 80px 40px;
    background: #0D0010;
    overflow: hidden;
  }

  .anarchy-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(194,0,255,0.1) 2px, transparent 2px);
    background-size: 20px 20px;
    pointer-events: none;
  }

  .section-title {
    font-size: clamp(40px, 8vw, 100px);
    text-align: center;
    position: relative;
    z-index: 5;
    line-height: 1;
  }

  .section-title .outline {
    -webkit-text-stroke: 3px var(--purple);
    color: transparent;
    display: block;
  }

  .section-title .filled {
    color: var(--yellow);
    text-shadow: 4px 4px 0 var(--purple);
    display: block;
    transform: skewX(-5deg);
    display: inline-block;
  }

  /* RULES GRID */
  .rules-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 0;
    max-width: 1200px;
    margin: 60px auto 0;
    border: 5px solid var(--black);
  }

  .rule-card {
    background: var(--white);
    border: 5px solid var(--black);
    padding: 30px;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
  }

  .rule-card:nth-child(2) { background: var(--red); }
  .rule-card:nth-child(3) { background: var(--purple); color: var(--white); }
  .rule-card:nth-child(4) { background: var(--yellow); }
  .rule-card:nth-child(5) { background: #0D0010; border-color: var(--yellow); }
  .rule-card:nth-child(6) { background: var(--orange); }

  .rule-card:hover {
    transform: translate(-4px, -4px);
    z-index: 10;
    box-shadow: 8px 8px 0 var(--black);
  }

  .rule-num {
    font-size: 80px;
    opacity: 0.15;
    position: absolute;
    top: -10px;
    right: 10px;
    line-height: 1;
    color: var(--black);
    font-family: 'Bangers', cursive;
  }

  .rule-card:nth-child(3) .rule-title { color: var(--white); }
  .rule-card:nth-child(3) .rule-text { color: rgba(255,248,220,0.9); }
  .rule-card:nth-child(3) .rule-num { color: var(--white); }

  .rule-icon {
    font-size: 36px;
    margin-bottom: 12px;
    display: block;
  }

  .rule-title {
    font-size: 28px;
    color: var(--black);
    margin-bottom: 8px;
    letter-spacing: 2px;
    position: relative;
    z-index: 2;
  }

  .rule-card:nth-child(5) .rule-title { color: var(--white); }

  .rule-text {
    font-family: 'Special Elite', cursive;
    font-size: 14px;
    color: var(--black);
    line-height: 1.6;
    position: relative;
    z-index: 2;
  }

  .rule-card:nth-child(5) .rule-text { color: var(--white); }

  /* SPEECH BUBBLE */
  .speech-bubble {
    position: relative;
    background: var(--white);
    border: 4px solid var(--black);
    border-radius: 20px;
    padding: 20px 30px;
    font-family: 'Bangers', cursive;
    font-size: 28px;
    color: var(--black);
    letter-spacing: 2px;
    display: inline-block;
    text-align: center;
    box-shadow: 5px 5px 0 var(--black);
  }

  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -24px;
    left: 40px;
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 8px solid transparent;
    border-top: 24px solid var(--black);
  }

  .speech-bubble::before {
    content: '';
    position: absolute;
    bottom: -18px;
    left: 42px;
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 7px solid transparent;
    border-top: 22px solid var(--white);
    z-index: 1;
  }

  /* EXPLOSION / ZAP badges */
  .explosion {
    display: inline-block;
    position: relative;
    font-family: 'Bangers', cursive;
    font-size: 20px;
    letter-spacing: 2px;
    text-align: center;
    padding: 8px 16px;
  }

  .explosion-bg {
    position: absolute;
    inset: 0;
    z-index: -1;
    clip-path: polygon(50% 0%, 61% 30%, 98% 20%, 75% 50%, 98% 80%, 61% 70%, 50% 100%, 39% 70%, 2% 80%, 25% 50%, 2% 20%, 39% 30%);
    background: var(--yellow);
  }

  /* FEATURES SECTION */
  .features-section {
    background: #140020;
    padding: 80px 40px;
    position: relative;
    overflow: hidden;
  }

  .features-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(194,0,255,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(194,0,255,0.07) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* WEB PATTERN BACKGROUND */
  .web-bg {
    position: absolute;
    inset: 0;
    opacity: 0.08;
    z-index: 0;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(194,0,255,0.4) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(255,229,0,0.2) 0%, transparent 60%);
  }

  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 30px;
    max-width: 1100px;
    margin: 60px auto 0;
    position: relative;
    z-index: 5;
  }

  .feat-card {
    border: 4px solid;
    padding: 30px 24px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s;
  }

  .feat-card:nth-child(1) { border-color: var(--red); }
  .feat-card:nth-child(2) { border-color: var(--blue); }
  .feat-card:nth-child(3) { border-color: var(--yellow); }
  .feat-card:nth-child(4) { border-color: var(--purple); }

  .feat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
  }

  .feat-card:nth-child(1)::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top left, rgba(232,0,45,0.1), transparent 70%);
    pointer-events: none;
  }

  .feat-card:hover {
    transform: translateY(-6px);
  }

  .feat-num {
    font-size: 60px;
    color: var(--red);
    line-height: 1;
    margin-bottom: 8px;
  }

  .feat-card:nth-child(2) .feat-num { color: var(--blue); }
  .feat-card:nth-child(3) .feat-num { color: var(--yellow); }
  .feat-card:nth-child(4) .feat-num { color: var(--purple); }

  .feat-title {
    font-size: 30px;
    letter-spacing: 2px;
    margin-bottom: 10px;
    color: var(--white);
  }

  .feat-text {
    font-family: 'Special Elite', cursive;
    font-size: 13px;
    color: rgba(245,240,232,0.7);
    line-height: 1.7;
  }

  /* GRAFFITI TAG decoration */
  .graffiti-tag {
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(30px, 5vw, 60px);
    color: transparent;
    -webkit-text-stroke: 2px;
    transform: rotate(-15deg);
    display: inline-block;
    opacity: 0.3;
    position: absolute;
    pointer-events: none;
  }

  /* JOIN SECTION */
  .join-section {
    padding: 100px 40px;
    background: #0D0010;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .join-section::before {
    content: '!!';
    position: absolute;
    font-size: 600px;
    font-family: 'Bangers', cursive;
    color: transparent;
    -webkit-text-stroke: 3px rgba(232,0,45,0.07);
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    line-height: 1;
    pointer-events: none;
  }

  .join-title {
    font-size: clamp(50px, 12vw, 140px);
    line-height: 0.9;
    position: relative;
    z-index: 5;
  }

  .join-title span:first-child {
    display: block;
    color: var(--yellow);
    text-shadow: 5px 5px 0 var(--purple);
  }

  .join-title span:last-child {
    display: block;
    color: var(--white);
    text-shadow: 5px 5px 0 var(--purple);
    transform: skewX(-6deg);
    display: inline-block;
  }

  .join-discord {
    margin-top: 50px;
    position: relative;
    z-index: 5;
    display: inline-block;
  }

  .join-discord a {
    font-family: 'Bangers', cursive;
    font-size: clamp(20px, 4vw, 36px);
    letter-spacing: 4px;
    padding: 20px 60px;
    background: #5865F2;
    color: var(--white);
    border: 5px solid var(--black);
    box-shadow: 10px 10px 0 var(--black);
    text-decoration: none;
    display: inline-block;
    transition: all 0.15s;
    text-shadow: 2px 2px 0 var(--black);
    transform: rotate(-1deg);
  }

  .join-discord a:hover {
    transform: rotate(-1deg) translate(-4px,-4px);
    box-shadow: 14px 14px 0 var(--black);
  }

  /* FOOTER */
  footer {
    background: #0D0010;
    border-top: 6px solid var(--yellow);
    padding: 30px 40px;
    text-align: center;
    font-family: 'Special Elite', cursive;
    font-size: 13px;
    color: rgba(245,240,232,0.4);
    letter-spacing: 2px;
  }

  footer strong {
    color: var(--yellow);
    font-family: 'Bangers', cursive;
    font-size: 18px;
    letter-spacing: 3px;
  }

  /* CRACK EFFECT */
  .crack-line {
    position: absolute;
    background: var(--red);
    opacity: 0.6;
    pointer-events: none;
    z-index: 15;
  }

  /* HALFTONE DOTS SVG pattern */
  .halftone-area {
    position: absolute;
    pointer-events: none;
    z-index: 6;
    opacity: 0.4;
  }

  /* COMIC TEXT EFFECTS */
  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.4; }
    98% { opacity: 0.8; }
  }

  @keyframes slideIn {
    from { transform: translateX(-100px) rotate(-5deg); opacity: 0; }
    to { transform: translateX(0) rotate(-5deg); opacity: 1; }
  }

  @keyframes bounce-in {
    0% { transform: scale(0) rotate(-10deg); }
    60% { transform: scale(1.2) rotate(3deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .hero-title {
    animation: bounce-in 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  .sticker {
    animation: slideIn 0.6s 0.3s both;
  }

  /* ZAP shape */
  .zap-badge {
    position: absolute;
    font-family: 'Bangers', cursive;
    font-size: 16px;
    letter-spacing: 1px;
    color: var(--black);
    background: var(--yellow);
    padding: 6px 14px;
    clip-path: polygon(0 0, 100% 0, 95% 50%, 100% 100%, 0 100%, 5% 50%);
    border: 2px solid var(--black);
    z-index: 30;
    white-space: nowrap;
  }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    nav { padding: 12px 20px; }
    .anarchy-section, .features-section, .join-section { padding: 60px 20px; }
    .lang-switch { top: 10px; right: 10px; }
    .btn { font-size: 18px; padding: 12px 24px; }
  }

  /* HIDE/SHOW language content */
  [data-lang] { display: none; }
  [data-lang="pl"] { display: block; }
  .lang-inline[data-lang] { display: none; }
  .lang-inline[data-lang="pl"] { display: inline; }

  body.en [data-lang="pl"] { display: none; }
